[project]
name = "prahari"
version = "0.1.0"
description = "PRAHARI — federated video intelligence for Gujarat Police Sentinel 2026"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "httpx>=0.27,<1",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10",
    "av>=14,<19",
    "onnxruntime>=1.20,<2",
    "fast-alpr[onnx]>=0.4,<0.5",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "prahari.api.app:app"
