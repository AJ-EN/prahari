[project]
name = "prahari"
version = "0.1.0"
description = "PRAHARI — federated video intelligence for Gujarat Police Sentinel 2026"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "structlog>=24.4",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv]
package = false
